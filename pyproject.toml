[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycanha"
version = "0.23.0"
description = "Thermal analysis Python package built on pycanha-core"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Javier Piqueras Carreño", email = "javier.piqueras@upm.es" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "h5py>=3.10",
    "lark>=1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.0",
    "pycanha-core==0.23.0",
    # Qt for the interactive viewer (``pycanha.plot``). Essentials rather than the
    # ``PySide6`` meta-package: it carries QtCore/QtGui/QtWidgets - all that pyvistaqt,
    # matplotlib's QtAgg backend and the viewer import - while the meta-package also
    # pulls PySide6-Addons (QtWebEngine, Qt3D, Multimedia), hundreds of MB nothing here
    # touches. The wheels are abi3 (``cp310-abi3``, requires-python <3.15), so one build
    # covers 3.13 and 3.14 on linux/macos/windows alike.
    "PySide6-Essentials>=6.8",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
doc = [
    "sphinx>=7.2",
    "pydata-sphinx-theme>=0.16",
    "sphinx-gallery>=0.18",
    "sphinx-copybutton",
    "sphinx-design",
    "numpydoc",
    "numpy",
    # Interactive pyvista rendering (Jupyter/trame backend) + notebook runtime
    # used by the example notebooks and the interactive gallery.
    "trame>=3.6",
    # trame-client 3.13.3 ships without its bundled client assets
    # (``trame_client/module/vue{2,3}-www``). pyvista's ``export_vtksz`` - the
    # call behind every gallery plot once ``BUILDING_GALLERY`` is on - launches
    # a trame server that registers those directories as static routes: the
    # first launch raises and every launch after it blocks forever, so a docs
    # build hangs until the builder kills it. Lift the cap once a release ships
    # the assets again.
    "trame-client<3.13.3",
    "trame-vtk>=2.8",
    "trame-vuetify>=2.7",
    "ipywidgets>=8.1",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbformat>=5.10",
]

[project.urls]
Homepage = "https://github.com/pycanha-project/pycanha"
Repository = "https://github.com/pycanha-project/pycanha"
Issues = "https://github.com/pycanha-project/pycanha/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pycanha"]

[tool.uv]
# Force transitive deps above known-vulnerable versions (pip-audit).
# msgpack < 1.2.1 (pulled in via pip-audit -> cachecontrol): GHSA-6v7p-g79w-8964.
# pillow < 12.3.0 (pulled in via matplotlib / pyvista / sphinx-gallery):
# PYSEC-2026-2253..2257, -3451..3454, -3493..3496.
constraint-dependencies = ["msgpack>=1.2.1", "pillow>=12.3.0"]

[dependency-groups]
dev = [
    # Lint / format
    "ruff>=0.6",
    # Type checkers
    "mypy>=1.10",
    "pyright>=1.1.380",
    "ty>=0.0.30",
    # Security & metadata
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "validate-pyproject>=0.19",
    "zizmor>=0.6",
    # Testing
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
branch = true
source = ["src/pycanha"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "PIE",   # misc lints
    "PT",    # pytest style
    "RUF",   # ruff-specific
    "S",     # flake8-bandit (security; some overlap with bandit but cheap)
    "A",     # flake8-builtins (don't shadow builtins)
    "RET",   # flake8-return
    "ARG",   # unused arguments
    "PTH",   # use pathlib
    "ERA",   # eradicate (commented-out code)
    "PL",    # pylint subset (subset that's actually useful)
    "TRY",   # tryceratops (exception antipatterns)
    "PERF",  # perflint
]
ignore = [
    "PLR0913",  # too many arguments - common in scientific code
    "PLR2004",  # magic value comparison - too noisy in scientific code
    "TRY003",   # long exception messages - fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # asserts are the whole point of pytest
    "PLR2004",  # magic numbers in tests are fine
    "ARG",      # fixtures often look unused
]
# Qt's virtuals are camelCase (rowCount, columnCount, headerData, flags, setData...).
# Overriding them is the only way to implement a model or a widget, and an override has
# to keep the name it overrides - there is no code change that satisfies N802 here.
# Scoped to the two modules that subclass Qt, and to that one rule.
"src/pycanha/plot/tree_model.py" = ["N802"]
"src/pycanha/plot/window.py" = ["N802"]
"src/pycanha/plot/timehistory.py" = ["N802"]
"src/pycanha/plot/panels/*.py" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["pycanha"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
module = "h5py.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyvista.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyvistaqt.*"
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests"]
# Test files that still have pre-existing type errors. This list is a ratchet:
# every test file not named here is checked, so new breakage cannot land.
# Remove entries as they are fixed; do not add new ones.
exclude = [
    # Needs the same accessor-narrowing on ThermalMathematicalModel.formulas.
    "tests/tmm/test_thermal_model.py",
]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = false

# Tests are checked, but at a lower strictness than the package: test code
# legitimately reaches for private attributes and passes deliberately-wrong
# types to assert that they raise. A bare expression is the normal way to
# trigger the error inside a `with pytest.raises(...)` block.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
reportUnusedExpression = "none"

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
